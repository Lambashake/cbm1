<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chota Baby Mroq: Chembur Rampage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #05050a;
      color: #00ff66;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00ff66;
      text-shadow: 2px 2px #ff0055;
    }
    .game-box {
      position: relative;
      border: 4px solid #222;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
    }
    canvas {
      display: block;
      background-color: #0a0014;
      image-rendering: pixelated;
    }
    .instructions {
      margin-top: 10px;
      color: #aaa;
      font-size: 13px;
    }
    kbd {
      background: #222;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

  <h1>CHOTA BABY MROQ DESTROYS CHEMBUR</h1>
  <div class="game-box">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>
  <div class="instructions">
    Move: <kbd>A</kbd> / <kbd>D</kbd> or <kbd>←</kbd> / <kbd>→</kbd> | Smash: <kbd>SPACE</kbd> | Screen-Nuke Breath: <kbd>ENTER</kbd>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- PURE AUDIO SYNTHESIZER ---
let audioCtx = null;
function playSound(type) {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'smash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'nuke') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.linearRampToValueAtTime(30, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    }
  } catch(e) {}
}

// --- GAME STATE VARIABLES ---
let gameState = 'START';
let score = 0;
let highScore = 0;
let timer = 60;
let timerInterval = null;
let stagesCleared = 0;

let breathEnergy = 0;
const maxBreathEnergy = 100;
let nukeActiveTimer = 0;
let screenShake = 0;

let bgOffset = 0;
let transitionProgress = 0;
let isTransitioning = false;

// --- LOCATIONS FOR CHEMBUR BACKDROPS ---
const locationSets = [
  ["Chembur Stn", "Diamond Gdn", "RK Studio", "KSTAR Mall", "Monorail Pier", "Fine Arts", "SCLR Flyover"],
  ["BARC Gate", "Chembur Camp", "Sattu Sweets", "Golf Club", "Sindhi Colony", "Basant Cinema", "Trombay Hill"],
  ["Acharya Col", "Chimni Garden", "Ambedkar Park", "Central Ave", "Deonar Chowk", "Vaidya Ground", "Shell Colony"]
];

const player = {
  x: 50, y: 280, w: 60, h: 80,
  speed: 5.5, dir: 'right',
  hp: 100, maxHp: 100,
  attacking: false, attackTimer: 0
};

let buildings = [];
let helicopters = [];
let bullets = [];
let particles = [];
let popups = [];

function initBuildings(setIndex = 0) {
  buildings = [];
  const currentSet = locationSets[setIndex % locationSets.length];
  const count = 7;
  const spacing = 105;
  for (let i = 0; i < count; i++) {
    const h = 110 + Math.floor(Math.random() * 110);
    buildings.push({
      x: 40 + i * spacing, y: 360 - h, w: 80, h: h,
      hp: 100, maxHp: 100, name: currentSet[i % currentSet.length]
    });
  }
}

function spawnHelicopters() {
  if (gameState !== 'PLAYING') return;
  if (Math.random() < 0.035 && helicopters.length < 4 + Math.floor(stagesCleared * 0.5)) {
    const fromLeft = Math.random() < 0.5;
    helicopters.push({
      x: fromLeft ? -60 : canvas.width + 10,
      y: 40 + Math.random() * 120,
      w: 50, h: 22,
      vx: fromLeft ? (1.5 + Math.random() * 1.5) : -(1.5 + Math.random() * 1.5),
      fireCooldown: 40 + Math.random() * 40
    });
  }
}

// --- INPUT LISTENERS ---
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;

  if (gameState === 'START') { startGame(); return; }
  if (gameState === 'GAMEOVER' && (e.code === 'KeyR' || e.code === 'Space')) { startGame(); return; }

  if (gameState === 'PLAYING') {
    if (e.code === 'Space' && !player.attacking) {
      player.attacking = true; player.attackTimer = 10;
      playSound('smash'); performSmash();
    }
    if (e.code === 'Enter' && breathEnergy >= maxBreathEnergy) {
      triggerAtomicNuke();
    }
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
canvas.addEventListener('click', () => {
  if (gameState === 'START' || gameState === 'GAMEOVER') startGame();
  else if (gameState === 'PLAYING' && breathEnergy >= maxBreathEnergy) triggerAtomicNuke();
});

// --- CORE GAME ACTIONS ---
function startGame() {
  score = 0; timer = 60; stagesCleared = 0;
  breathEnergy = 0; player.hp = 100;
  helicopters = []; bullets = []; particles = []; popups = [];
  gameState = 'PLAYING';
  initBuildings(0); resetTimer();
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gameState === 'PLAYING') {
      timer--;
      if (timer <= 0) gameOver();
    }
  }, 1000);
}

function gameOver() {
  gameState = 'GAMEOVER';
  if (score > highScore) highScore = score;
  clearInterval(timerInterval);
}

function triggerAtomicNuke() {
  breathEnergy = 0;
  nukeActiveTimer = 35;
  screenShake = 25;
  playSound('nuke');

  // Destroy all bullets
  bullets = [];

  // Destroy all helicopters with bonus points
  helicopters.forEach(h => {
    score += 300;
    addPopup("+300", h.x, h.y, '#00ffff');
    createParticles(h.x + h.w/2, h.y + h.h/2, '#00ffff', 12);
  });
  helicopters = [];

  // Destroy all remaining buildings
  buildings.forEach(b => {
    if (b.hp > 0) {
      b.hp = 0;
      score += 600;
      addPopup("NUKE! +600", b.x + b.w/2, b.y + 20, '#ff0055');
      createParticles(b.x + b.w/2, b.y + b.h/2, '#00ffaa', 15);
    }
  });

  checkStageClear();
}

function performSmash() {
  const range = 60;
  const smashX = player.dir === 'right' ? player.x + player.w : player.x - range;

  // Damage Buildings
  buildings.forEach(b => {
    if (b.hp > 0 && smashX < b.x + b.w && smashX + range > b.x) {
      b.hp = Math.max(0, b.hp - 35);
      score += 100;
      breathEnergy = Math.min(maxBreathEnergy, breathEnergy + 12);
      addPopup("+100", b.x + b.w/2, b.y + 20);
      createParticles(b.x + b.w/2, b.y + b.h/2, '#ffaa00', 6);

      if (b.hp === 0) {
        score += 400;
        breathEnergy = Math.min(maxBreathEnergy, breathEnergy + 20);
        addPopup("DESTROYED! +400", b.x + b.w/2, b.y - 10, '#ff0055');
        checkStageClear();
      }
    }
  });
}

function checkStageClear() {
  const allDestroyed = buildings.every(b => b.hp <= 0);
  if (allDestroyed && !isTransitioning) {
    stagesCleared++;
    score += 1000;
    addPopup("CHEMBUR STAGE CLEARED! +1000", canvas.width/2, 150, '#00ff66');
    isTransitioning = true;
    transitionProgress = 0;
  }
}

function createParticles(x, y, color = '#ffaa00', count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      size: Math.random() * 6 + 3, life: 18, color: color
    });
  }
}

function addPopup(text, x, y, color = '#ffff00') {
  popups.push({ text, x: Math.max(40, Math.min(canvas.width - 40, x)), y, life: 35, color });
}

// --- UPDATE LOGIC ---
function update() {
  if (gameState !== 'PLAYING') return;

  // Horizontal Movement
  if (keys['KeyA'] || keys['ArrowLeft']) { player.x -= player.speed; player.dir = 'left'; }
  if (keys['KeyD'] || keys['ArrowRight']) { player.x += player.speed; player.dir = 'right'; }
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  if (player.attacking) {
    player.attackTimer--;
    if (player.attackTimer <= 0) player.attacking = false;
  }

  // Handle Nuke Timers & Effects
  if (nukeActiveTimer > 0) nukeActiveTimer--;
  if (screenShake > 0) screenShake--;

  // Stage Transition Animation
  if (isTransitioning) {
    transitionProgress += 0.05;
    bgOffset -= 15;
    if (transitionProgress >= 1) {
      isTransitioning = false;
      bgOffset = 0;
      initBuildings(stagesCleared);
    }
  }

  spawnHelicopters();

  // Helicopters AI & Bullet Hell Logic
  helicopters.forEach((h, i) => {
    h.x += h.vx;
    if (h.x < -100 || h.x > canvas.width + 100) helicopters.splice(i, 1);

    h.fireCooldown--;
    if (h.fireCooldown <= 0) {
      h.fireCooldown = 35 + Math.random() * 30;
      // Fire bullet directly towards Mroq
      const dx = (player.x + player.w/2) - (h.x + h.w/2);
      const dy = (player.y + player.h/2) - (h.y + h.h/2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      bullets.push({
        x: h.x + h.w/2, y: h.y + h.h/2,
        vx: (dx / dist) * 4.5, vy: (dy / dist) * 4.5
      });
    }
  });

  // Bullet Updates & Hit Collision
  bullets.forEach((b, i) => {
    b.x += b.vx; b.y += b.vy;

    if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {
      player.hp = Math.max(0, player.hp - 8);
      screenShake = 6;
      playSound('hit');
      addPopup("-8 HP", player.x + player.w/2, player.y - 10, '#ff0000');
      bullets.splice(i, 1);

      if (player.hp <= 0) gameOver();
    }
    if (b.x < 0 || b.x > canvas.width || b.y > 400) bullets.splice(i, 1);
  });

  // VFX Updates
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  });
  popups.forEach((pop, i) => {
    pop.y -= 1; pop.life--;
    if (pop.life <= 0) popups.splice(i, 1);
  });
}

// --- RENDER LOGIC ---
function drawPlayer() {
  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
  if (player.dir === 'left') ctx.scale(-1, 1);

  ctx.fillStyle = '#1c7c34'; ctx.fillRect(-20, -30, 40, 60);
  ctx.fillStyle = '#145a25'; ctx.fillRect(-10, -40, 35, 20);
  ctx.fillStyle = '#ffea00'; ctx.fillRect(15, -35, 6, 6);
  ctx.fillStyle = '#00ffaa';
  ctx.fillRect(-24, -20, 6, 8); ctx.fillRect(-24, -5, 6, 8); ctx.fillRect(-24, 10, 6, 8);

  if (player.attacking) {
    ctx.fillStyle = '#ffea00'; ctx.fillRect(20, -10, 25, 12);
  }
  ctx.restore();

  ctx.fillStyle = '#00ff66'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
  ctx.fillText('MROQ', player.x + player.w / 2, player.y - 10);
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  // Background Sky & Moon
  ctx.fillStyle = '#0a0014'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(720, 60, 30, 0, Math.PI * 2); ctx.fill();

  // Ground Line
  ctx.fillStyle = '#1a0d00'; ctx.fillRect(0, 360, canvas.width, 90);
  ctx.fillStyle = '#00ff66'; ctx.fillRect(0, 356, canvas.width, 4);

  // Render Buildings (with sliding transition support)
  ctx.save();
  if (isTransitioning) ctx.translate(bgOffset, 0);

  buildings.forEach(b => {
    if (b.hp > 0) {
      const currentH = (b.h * (b.hp / b.maxHp));
      const currentY = 360 - currentH;
      ctx.fillStyle = '#2d2d48'; ctx.fillRect(b.x, currentY, b.w, currentH);
      ctx.fillStyle = '#ffea00';
      for (let wx = b.x + 10; wx < b.x + b.w - 10; wx += 20) {
        for (let wy = currentY + 10; wy < 350; wy += 25) { ctx.fillRect(wx, wy, 8, 12); }
      }
      ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(b.name, b.x + b.w / 2, 378);
    } else {
      ctx.fillStyle = '#333'; ctx.fillRect(b.x, 345, b.w, 15);
      ctx.fillStyle = '#ff0055'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText('RUINED', b.x + b.w / 2, 357);
    }
  });
  ctx.restore();

  // Draw Helicopters & Bullets
  helicopters.forEach(h => {
    ctx.fillStyle = '#777'; ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.fillStyle = '#00ffff'; ctx.fillRect(h.x + h.w/2 - 5, h.y + 4, 10, 6);
    ctx.fillStyle = '#fff'; ctx.fillRect(h.x - 10, h.y - 3, h.w + 20, 3); // Spinning Blade
  });

  bullets.forEach(b => {
    ctx.fillStyle = '#ff0055'; ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
  });

  drawPlayer();

  // Screen-Nuke Visual FX Overlay
  if (nukeActiveTimer > 0) {
    ctx.fillStyle = `rgba(0, 255, 200, ${nukeActiveTimer / 35})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Particle Explosions & Floating Text
  particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
  popups.forEach(pop => { ctx.fillStyle = pop.color; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.fillText(pop.text, pop.x, pop.y); });

  // HUD: Score & Stage Info
  ctx.fillStyle = '#00ff66'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score}`, 20, 28);
  ctx.fillText(`CHEMBUR SECTOR: #${stagesCleared + 1}`, 20, 48);

  // HUD: Health Bar
  ctx.fillStyle = '#333'; ctx.fillRect(20, 60, 140, 10);
  ctx.fillStyle = player.hp > 30 ? '#00ff66' : '#ff0055'; 
  ctx.fillRect(20, 60, (player.hp / player.maxHp) * 140, 10);
  ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.fillText(`HP: ${player.hp}%`, 22, 68);

  // HUD: ATOMIC BREATH BAR (Screen-Nuke)
  const isFull = breathEnergy >= maxBreathEnergy;
  ctx.fillStyle = '#222'; ctx.fillRect(20, 80, 200, 16);
  ctx.fillStyle = isFull ? (Math.floor(Date.now()/100)%2 === 0 ? '#00ffff' : '#ff00aa') : '#00aaeb';
  ctx.fillRect(20, 80, (breathEnergy / maxBreathEnergy) * 200, 16);
  ctx.fillStyle = isFull ? '#000' : '#fff'; ctx.font = 'bold 10px monospace';
  ctx.fillText(isFull ? 'PRESS ENTER FOR ATOMIC NUKE!' : `BREATH ENERGY: ${Math.floor(breathEnergy)}%`, 25, 92);

  // Timer & High Score
  ctx.textAlign = 'right'; ctx.fillStyle = timer <= 10 ? '#ff0055' : '#00ff66';
  ctx.font = 'bold 16px monospace';
  ctx.fillText(`TIME: ${timer}s`, canvas.width - 20, 28);
  ctx.fillStyle = '#00ff66'; ctx.font = '14px monospace';
  ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 20, 48);

  // Overlay Screens
  if (gameState === 'START') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff66'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
    ctx.fillText('CHOTA BABY MROQ: CHEMBUR BLITZ', canvas.width / 2, 170);
    ctx.font = '13px monospace'; ctx.fillStyle = '#ffffff';
    ctx.fillText('Dodge helicopter bullets, smash landmarks, fill your Atomic Bar,', canvas.width / 2, 210);
    ctx.fillText('and unleash SCREEN-NUKE BREATH to clear entire sectors!', canvas.width / 2, 230);
    ctx.fillStyle = '#00ff66'; ctx.font = '15px monospace';
    ctx.fillText('PRESS ANY KEY OR CLICK TO PLAY', canvas.width / 2, 280);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
    ctx.fillText(player.hp <= 0 ? 'MROQ WAS DESTROYED!' : 'TIME IS UP!', canvas.width / 2, 150);
    ctx.fillStyle = '#ffffff'; ctx.font = '18px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, 195);
    ctx.fillText(`SECTORS LEVELED: ${stagesCleared}`, canvas.width / 2, 225);
    ctx.fillStyle = '#00ff66'; ctx.font = '14px monospace';
    ctx.fillText("Press 'SPACE' or Click to Play Again!", canvas.width / 2, 280);
  }

  ctx.restore();
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
