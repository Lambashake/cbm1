<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chota Baby Mroq Destroys Chembur - Arcade Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #05050a;
      color: #00ff66;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00ff66;
      text-shadow: 2px 2px #ff0055;
    }
    .game-box {
      position: relative;
      border: 4px solid #222;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
    }
    canvas {
      display: block;
      background-color: #0a0014;
      image-rendering: pixelated;
    }
    .instructions {
      margin-top: 10px;
      color: #aaa;
      font-size: 13px;
    }
    kbd {
      background: #222;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

  <h1>CHOTA BABY MROQ DESTROYS CHEMBUR</h1>
  <div class="game-box">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>
  <div class="instructions">
    Move: <kbd>A</kbd> / <kbd>D</kbd> or <kbd>←</kbd> / <kbd>→</kbd> | Smash: <kbd>SPACE</kbd> | Atomic Breath: <kbd>ENTER</kbd>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- PURE AUDIO SYNTHESIZER ---
let audioCtx = null;
function playSound(type) {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'smash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'breath') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.linearRampToValueAtTime(500, now + 0.1);
      osc.frequency.linearRampToValueAtTime(100, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'explosion') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.linearRampToValueAtTime(20, now + 0.25);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'damage') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.linearRampToValueAtTime(30, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    }
  } catch(e) {}
}

// --- GAME STATE ---
let gameState = 'START'; 
let score = 0;
let highScore = 0;
let timer = 60;
let dayCounter = 1;
let timerInterval = null;
let combo = 1;
let comboTimer = 0;

// --- PLAYER STATS ---
const player = {
  x: 50, y: 270, w: 60, h: 90,
  speed: 5, dir: 'right',
  hp: 100, maxHp: 100,
  attacking: false, attackType: '', attackTimer: 0
};

let buildings = [];
let military = [];
let bullets = [];
let particles = [];
let popups = [];

const chemburPlaces = [
  "Chembur Stn", "KSTAR Mall", "Monorail", 
  "RK Studio", "Diamond Gdn", "Golf Club", "Fine Arts"
];

function initBuildings() {
  buildings = [];
  const count = 7;
  const spacing = 100;
  for (let i = 0; i < count; i++) {
    const h = 100 + Math.floor(Math.random() * 120);
    buildings.push({
      x: 80 + i * spacing, y: 360 - h, w: 80, h: h,
      hp: 100, maxHp: 100, name: chemburPlaces[i % chemburPlaces.length]
    });
  }
}

function spawnMilitary() {
  if (gameState !== 'PLAYING') return;

  // Police car spawn
  if (Math.random() < 0.03 && military.filter(m => m.type === 'police').length < 3) {
    military.push({
      type: 'police', x: Math.random() < 0.5 ? -40 : canvas.width + 10,
      y: 335, w: 35, h: 20, hp: 1, speed: 2, fireCooldown: 60
    });
  }
  // Tank spawn
  if (Math.random() < 0.015 && military.filter(m => m.type === 'tank').length < 2) {
    military.push({
      type: 'tank', x: Math.random() < 0.5 ? -50 : canvas.width + 10,
      y: 325, w: 50, h: 30, hp: 40, speed: 1.2, fireCooldown: 90
    });
  }
  // Chopper spawn
  if (Math.random() < 0.02 && military.filter(m => m.type === 'chopper').length < 2) {
    military.push({
      type: 'chopper', x: Math.random() < 0.5 ? -60 : canvas.width + 10,
      y: 50 + Math.random() * 100, w: 55, h: 25, hp: 20, speed: 2.5, fireCooldown: 80
    });
  }
}

// --- CONTROLS ---
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;

  if (gameState === 'START') { startGame(); return; }
  if (gameState === 'GAMEOVER' && (e.code === 'KeyR' || e.code === 'Space')) { nextDay(); return; }

  if (gameState === 'PLAYING' && !player.attacking) {
    if (e.code === 'Space') {
      player.attacking = true; player.attackType = 'smash'; player.attackTimer = 12;
      playSound('smash'); checkAttackHit();
    } else if (e.code === 'Enter') {
      player.attacking = true; player.attackType = 'breath'; player.attackTimer = 20;
      playSound('breath'); checkAttackHit();
    }
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
canvas.addEventListener('click', () => {
  if (gameState === 'START') startGame();
  else if (gameState === 'GAMEOVER') nextDay();
});

// --- GAME LOGIC ---
function startGame() {
  score = 0; timer = 60; dayCounter = 1; gameState = 'PLAYING';
  player.hp = 100; combo = 1; comboTimer = 0;
  military = []; bullets = []; particles = []; popups = [];
  initBuildings(); resetTimer();
}

function nextDay() {
  dayCounter++; timer = 60; gameState = 'PLAYING';
  player.hp = 100; combo = 1; comboTimer = 0;
  military = []; bullets = []; particles = []; popups = [];
  initBuildings(); playSound('rebuild'); resetTimer();
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gameState === 'PLAYING') {
      timer--;
      if (timer <= 0) gameOver();
    }
  }, 1000);
}

function gameOver() {
  gameState = 'GAMEOVER';
  if (score > highScore) highScore = score;
  clearInterval(timerInterval);
}

function addScore(basePts, x, y, label = '') {
  comboTimer = 120; // 2 seconds to extend combo
  const finalPts = basePts * combo;
  score += finalPts;
  addPopup(`${label} +${finalPts}${combo > 1 ? ' ('+combo+'x)' : ''}`, x, y, combo > 2 ? '#ff0055' : '#ffff00');
  combo = Math.min(5, combo + 0.5); // Increment combo up to 5x
}

function createDebris(x, y, color = '#ffaa00') {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x, y: y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
      size: Math.random() * 5 + 3, life: 15, color: color
    });
  }
}

function addPopup(text, x, y, color = '#ffff00') {
  popups.push({ text, x, y, life: 30, color });
}

function checkAttackHit() {
  const range = player.attackType === 'breath' ? 220 : 60;
  const attackX = player.dir === 'right' ? player.x + player.w : player.x - range;

  // Hit Buildings
  buildings.forEach(b => {
    if (b.hp > 0 && attackX < b.x + b.w && attackX + range > b.x) {
      const damage = player.attackType === 'breath' ? 35 : 20;
      b.hp = Math.max(0, b.hp - damage);
      addScore(player.attackType === 'breath' ? 150 : 80, b.x + b.w / 2, b.y + 20);
      createDebris(b.x + b.w / 2, b.y + b.h / 2);

      if (b.hp === 0) {
        addScore(500, b.x + b.w / 2, b.y - 10, 'DESTROYS LANDMARK!');
        playSound('explosion');
      }
    }
  });

  // Hit Military
  military.forEach((m, i) => {
    if (attackX < m.x + m.w && attackX + range > m.x && player.y < m.y + m.h && player.y + player.h > m.y) {
      const damage = player.attackType === 'breath' ? 40 : 25;
      m.hp -= damage;
      createDebris(m.x + m.w / 2, m.y + m.h / 2, '#555');

      if (m.hp <= 0) {
        const val = m.type === 'police' ? 150 : m.type === 'tank' ? 300 : 450;
        addScore(val, m.x + m.w / 2, m.y, `${m.type.toUpperCase()} KILLED!`);
        military.splice(i, 1);
        playSound('explosion');
      }
    }
  });

  // Deflect/Destroy Incoming Bullets
  bullets.forEach((b, i) => {
    if (attackX < b.x + 6 && attackX + range > b.x && player.y < b.y + 6 && player.y + player.h > b.y) {
      bullets.splice(i, 1);
      createDebris(b.x, b.y, '#00ffff');
    }
  });
}

function update() {
  if (gameState !== 'PLAYING') return;

  // Movement
  if (keys['KeyA'] || keys['ArrowLeft']) { player.x -= player.speed; player.dir = 'left'; }
  if (keys['KeyD'] || keys['ArrowRight']) { player.x += player.speed; player.dir = 'right'; }
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  if (player.attacking) {
    player.attackTimer--;
    if (player.attackTimer <= 0) player.attacking = false;
  }

  // Combo system decay
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) combo = 1;
  }

  spawnMilitary();

  // Update Military Units & AI Fire
  military.forEach((m, i) => {
    if (m.x < player.x) m.x += m.speed;
    else if (m.x > player.x) m.x -= m.speed;

    m.fireCooldown--;
    if (m.fireCooldown <= 0) {
      m.fireCooldown = m.type === 'police' ? 80 : m.type === 'tank' ? 120 : 90;
      const vx = m.x < player.x ? 4 : -4;
      const vy = m.type === 'chopper' ? 3 : 0;
      bullets.push({ x: m.x + m.w / 2, y: m.y + m.h / 2, vx: vx, vy: vy, type: m.type });
    }
  });

  // Update Bullets & Hit Player
  bullets.forEach((b, i) => {
    b.x += b.vx;
    b.y += b.vy;

    // Check collision with Mroq
    if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {
      const dmg = b.type === 'police' ? 5 : b.type === 'tank' ? 15 : 10;
      player.hp = Math.max(0, player.hp - dmg);
      addPopup(`-${dmg} HP`, player.x + player.w / 2, player.y, '#ff0000');
      playSound('damage');
      bullets.splice(i, 1);

      if (player.hp <= 0) gameOver();
    }

    // Out of bounds
    if (b.x < 0 || b.x > canvas.width || b.y > 400) bullets.splice(i, 1);
  });

  // Particles & Floating Text Updates
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  });
  popups.forEach((pop, i) => {
    pop.y -= 1; pop.life--;
    if (pop.life <= 0) popups.splice(i, 1);
  });
}

// --- RENDER ---
function drawPlayer() {
  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
  if (player.dir === 'left') ctx.scale(-1, 1);

  ctx.fillStyle = '#1c7c34'; ctx.fillRect(-20, -35, 40, 70);
  ctx.fillStyle = '#145a25'; ctx.fillRect(-10, -45, 35, 22);
  ctx.fillStyle = '#ffea00'; ctx.fillRect(15, -40, 6, 6);
  ctx.fillStyle = '#00ffaa';
  ctx.fillRect(-26, -25, 6, 8); ctx.fillRect(-26, -10, 6, 8); ctx.fillRect(-26, 5, 6, 8);

  if (player.attacking && player.attackType === 'breath') {
    ctx.fillStyle = '#00ffff'; ctx.fillRect(25, -40, 200, 12);
  }
  if (player.attacking && player.attackType === 'smash') {
    ctx.fillStyle = '#ffea00'; ctx.fillRect(20, -15, 30, 12);
  }
  ctx.restore();

  ctx.fillStyle = '#00ff66'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
  ctx.fillText('CHOTA BABY MROQ', player.x + player.w / 2, player.y - 12);
}

function drawMilitary() {
  military.forEach(m => {
    if (m.type === 'police') {
      ctx.fillStyle = '#0044ff'; ctx.fillRect(m.x, m.y, m.w, m.h);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(m.x + 5, m.y - 4, 10, 4); // Siren
    } else if (m.type === 'tank') {
      ctx.fillStyle = '#4b5320'; ctx.fillRect(m.x, m.y + 10, m.w, m.h - 10);
      ctx.fillRect(m.x + 10, m.y, 20, 10); // Turret
    } else if (m.type === 'chopper') {
      ctx.fillStyle = '#888888'; ctx.fillRect(m.x, m.y, m.w, m.h);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(m.x - 10, m.y - 4, m.w + 20, 3); // Blades
    }
  });

  bullets.forEach(b => {
    ctx.fillStyle = b.type === 'police' ? '#ffff00' : b.type === 'tank' ? '#ff0000' : '#ffaa00';
    ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
  });
}

function draw() {
  ctx.fillStyle = '#0a0014'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(720, 60, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#221100'; ctx.fillRect(0, 360, canvas.width, 90);
  ctx.fillStyle = '#00ff66'; ctx.fillRect(0, 356, canvas.width, 4);

  // Buildings
  buildings.forEach(b => {
    if (b.hp > 0) {
      const currentH = (b.h * (b.hp / b.maxHp));
      const currentY = 360 - currentH;
      ctx.fillStyle = '#3a3a5c'; ctx.fillRect(b.x, currentY, b.w, currentH);
      ctx.fillStyle = '#ffea00';
      for (let wx = b.x + 10; wx < b.x + b.w - 10; wx += 20) {
        for (let wy = currentY + 10; wy < 350; wy += 25) { ctx.fillRect(wx, wy, 8, 12); }
      }
      ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(b.name, b.x + b.w / 2, 378);
    } else {
      ctx.fillStyle = '#333'; ctx.fillRect(b.x, 345, b.w, 15);
      ctx.fillStyle = '#ff0055'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText('RUINED', b.x + b.w / 2, 357);
    }
  });

  drawMilitary();
  drawPlayer();

  // FX & Floating Text
  particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
  popups.forEach(pop => { ctx.fillStyle = pop.color; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.fillText(pop.text, pop.x, pop.y); });

  // HUD / Scoreboard
  ctx.fillStyle = '#00ff66'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 30);
  ctx.fillText(`DAY: ${dayCounter}`, 20, 52);

  // Health Bar HUD
  ctx.fillStyle = '#333'; ctx.fillRect(20, 65, 150, 12);
  ctx.fillStyle = player.hp > 30 ? '#00ff66' : '#ff0055'; 
  ctx.fillRect(20, 65, (player.hp / player.maxHp) * 150, 12);
  ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 25, 75);

  // Combo HUD
  if (combo > 1) {
    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 18px monospace';
    ctx.fillText(`RAMPAGE COMBO: ${combo.toFixed(1)}x`, 20, 100);
  }

  ctx.textAlign = 'right'; ctx.fillStyle = timer <= 10 ? '#ff0055' : '#00ff66';
  ctx.fillText(`TIME: ${timer}s`, canvas.width - 20, 30);
  ctx.fillStyle = '#00ff66'; ctx.fillText(`HIGH SCORE: ${Math.floor(highScore)}`, canvas.width - 20, 52);

  if (gameState === 'START') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff66'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
    ctx.fillText('CHOTA BABY MROQ DESTROYS CHEMBUR', canvas.width / 2, 170);
    ctx.font = '14px monospace'; ctx.fillStyle = '#ffffff';
    ctx.fillText('Defend against Police, Tanks & Helicopters!', canvas.width / 2, 210);
    ctx.fillText('PRESS ANY KEY (OR CLICK) TO START', canvas.width / 2, 260);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
    ctx.fillText(player.hp <= 0 ? 'MROQ WAS DEFEATED!' : 'TIME IS UP!', canvas.width / 2, 150);
    ctx.fillStyle = '#ffffff'; ctx.font = '18px monospace';
    ctx.fillText(`TOTAL SCORE: ${Math.floor(score)}`, canvas.width / 2, 200);
    ctx.fillStyle = '#00ff66'; ctx.font = '14px monospace';
    ctx.fillText('Chembur has rebuilt overnight!', canvas.width / 2, 250);
    ctx.fillText("Press 'SPACE' or 'R' to destroy it again!", canvas.width / 2, 280);
  }
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
