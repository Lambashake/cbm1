<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chembur Kaiju Rampage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #05050a;
      color: #00ff66;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      margin-bottom: 6px;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-color, #00ff66);
      text-shadow: 2px 2px #ff0055;
    }
    .game-box {
      position: relative;
      border: 4px solid #222;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
      max-width: 100vw;
    }
    canvas {
      display: block;
      background-color: #0a0014;
      image-rendering: pixelated;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    
    /* MOBILE TOUCH CONTROLS */
    .touch-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
      margin-top: 8px;
      padding: 0 10px;
    }
    @media (pointer: coarse), (max-width: 800px) {
      .touch-controls { display: flex; }
      .instructions { display: none; }
    }
    .d-pad, .action-pad { display: flex; gap: 8px; }
    .t-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-weight: bold;
      font-family: monospace;
      font-size: 14px;
      padding: 12px 18px;
      border-radius: 8px;
      touch-action: manipulation;
    }
    .t-btn:active { background: rgba(0, 255, 102, 0.4); }
    .t-btn.nuke { border-color: #00ffff; color: #00ffff; }
    .instructions { margin-top: 6px; color: #aaa; font-size: 12px; }
    kbd { background: #222; color: #fff; padding: 2px 6px; border-radius: 3px; border: 1px solid #444; }
  </style>
</head>
<body>

  <h1 id="titleText">CHEMBUR KAIJU RAMPAGE</h1>
  <div class="game-box">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div class="touch-controls">
    <div class="d-pad">
      <button class="t-btn" id="btnLeft">◄ LEFT</button>
      <button class="t-btn" id="btnRight">RIGHT ►</button>
    </div>
    <div class="action-pad">
      <button class="t-btn" id="btnSmash">SMASH</button>
      <button class="t-btn nuke" id="btnNuke">SPECIAL</button>
    </div>
  </div>

  <div class="instructions">
    Move: <kbd>A</kbd> / <kbd>D</kbd> | Smash: <kbd>SPACE</kbd> | Special Attack: <kbd>ENTER</kbd>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- PALETTE SYSTEM ---
const palettes = {
  neon:  { primary: '#00ff66', secondary: '#00ffff', accent: '#ff0055', bg: '#0a0014', window: '#ffea00' },
  retro: { primary: '#ff4400', secondary: '#ffcc00', accent: '#ff0000', bg: '#140500', window: '#ffaa00' },
  synth: { primary: '#ff00aa', secondary: '#00e5ff', accent: '#9d00ff', bg: '#090017', window: '#00ffff' }
};
let currentPaletteKey = 'neon';
let pal = palettes.neon;

function setPalette(key) {
  currentPaletteKey = key;
  pal = palettes[key];
  document.getElementById('titleText').style.setProperty('--primary-color', pal.primary);
}

// --- MONSTER TYPES ---
const monsters = [
  { id: 'godzilla', name: 'GODZILLA FORM', color: '#1c7c34', accent: '#00ffff', power: 'ATOMIC BREATH' },
  { id: 'cat', name: 'MEOWZILLA FORM', color: '#ffaa44', accent: '#ff00aa', power: 'NYAN LASER' },
  { id: 'bugblatter', name: 'BUGBLATTER BEAST FORM', color: '#8833aa', accent: '#00ff66', power: 'TOWEL WARP BLAST' }
];
let selectedMonsterIdx = 0;

// Dynamic Vibrant Building Colors
const buildingColors = [
  '#2a2a44', '#3d1c10', '#1a3a3a', '#441a2a', '#2c3e50', '#4a3b59', '#1e2b37'
];

// --- PURE AUDIO SYNTHESIZER ---
let audioCtx = null;
function playSound(type) {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'smash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'nuke') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.linearRampToValueAtTime(30, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    }
  } catch(e) {}
}

// --- GAME STATE VARIABLES ---
let gameState = 'PALETTE_SELECT'; // PALETTE_SELECT -> MONSTER_SELECT -> PLAYING -> GAMEOVER
let score = 0;
let highScore = 0;
let timer = 60;
let timerInterval = null;
let stagesCleared = 0;

let breathEnergy = 0;
const maxBreathEnergy = 100;
let nukeActiveTimer = 0;
let screenShake = 0;

let bgOffset = 0;
let transitionProgress = 0;
let isTransitioning = false;

// --- 5 CHEMBUR LOCATION SETS ---
const locationSets = [
  ["Chembur Stn", "Diamond Gdn", "RK Studio", "KSTAR Mall", "Monorail Pier", "Fine Arts", "SCLR Flyover"],
  ["BARC Gate", "Chembur Camp", "Sattu Sweets", "BPGC Golf Club", "Sindhi Colony", "Basant Cinema", "Trombay Hill"],
  ["Acharya Col", "Chimni Garden", "Ambedkar Park", "Central Ave", "Deonar Chowk", "Vaidya Ground", "Shell Colony"],
  ["TISS Campus", "Cubic Mall", "Tilak Nagar Stn", "Natraj Cinema", "Sahyadri Park", "Ghatkopar Link", "Acres Club"],
  ["Anushakti Nagar", "Mahul Village", "Mysore Colony", "RCF Plant", "Trombay Jetty", "Panvel Highway", "Chembur Gaothan"]
];

const player = {
  x: 50, y: 280, w: 60, h: 80,
  speed: 5.5, dir: 'right',
  hp: 100, maxHp: 100,
  attacking: false, attackTimer: 0
};

let buildings = [];
let helicopters = [];
let bullets = [];
let particles = [];
let popups = [];

function initBuildings(setIndex = 0) {
  buildings = [];
  const currentSet = locationSets[setIndex % locationSets.length];
  const count = 7;
  const spacing = 105;
  for (let i = 0; i < count; i++) {
    const h = 110 + Math.floor(Math.random() * 110);
    buildings.push({
      x: 40 + i * spacing, y: 360 - h, w: 80, h: h,
      hp: 100, maxHp: 100, name: currentSet[i % currentSet.length],
      color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
      style: Math.floor(Math.random() * 3),
      roofType: Math.floor(Math.random() * 3)
    });
  }
}

function spawnHelicopters() {
  if (gameState !== 'PLAYING') return;
  if (Math.random() < 0.03 && helicopters.length < 3 + Math.floor(stagesCleared * 0.4)) {
    const fromLeft = Math.random() < 0.5;
    helicopters.push({
      x: fromLeft ? -60 : canvas.width + 10,
      y: 40 + Math.random() * 110,
      w: 50, h: 22,
      vx: fromLeft ? (1.2 + Math.random() * 1.0) : -(1.2 + Math.random() * 1.0),
      fireCooldown: 50 + Math.random() * 40
    });
  }
}

// --- INPUT & MENU SELECTION LOGIC ---
const keys = {};

function handleInteraction(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const clickX = (clientX - rect.left) * scaleX;
  const clickY = (clientY - rect.top) * scaleY;

  if (gameState === 'PALETTE_SELECT') {
    const opts = ['neon', 'retro', 'synth'];
    for (let i = 0; i < opts.length; i++) {
      const boxY = 180 + i * 55;
      if (clickX >= 250 && clickX <= 550 && clickY >= boxY && clickY <= boxY + 40) {
        setPalette(opts[i]);
        gameState = 'MONSTER_SELECT';
        return;
      }
    }
  } else if (gameState === 'MONSTER_SELECT') {
    for (let i = 0; i < monsters.length; i++) {
      const boxY = 155 + i * 75;
      if (clickX >= 200 && clickX <= 600 && clickY >= boxY && clickY <= boxY + 58) {
        selectedMonsterIdx = i;
        startGame();
        return;
      }
    }
  } else if (gameState === 'GAMEOVER') {
    gameState = 'PALETTE_SELECT';
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleInteraction(e.clientX, e.clientY);
});

canvas.addEventListener('touchstart', (e) => {
  if (e.touches && e.touches[0]) {
    e.preventDefault();
    handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;

  if (gameState === 'PALETTE_SELECT') {
    if (e.code === 'Digit1') { setPalette('neon'); gameState = 'MONSTER_SELECT'; }
    if (e.code === 'Digit2') { setPalette('retro'); gameState = 'MONSTER_SELECT'; }
    if (e.code === 'Digit3') { setPalette('synth'); gameState = 'MONSTER_SELECT'; }
  } else if (gameState === 'MONSTER_SELECT') {
    if (e.code === 'Digit1') { selectedMonsterIdx = 0; startGame(); }
    if (e.code === 'Digit2') { selectedMonsterIdx = 1; startGame(); }
    if (e.code === 'Digit3') { selectedMonsterIdx = 2; startGame(); }
  } else if (gameState === 'GAMEOVER' && (e.code === 'KeyR' || e.code === 'Space')) {
    gameState = 'PALETTE_SELECT';
  } else if (gameState === 'PLAYING') {
    if (e.code === 'Space' && !player.attacking) triggerSmash();
    if (e.code === 'Enter' && breathEnergy >= maxBreathEnergy) triggerAtomicNuke();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Touch Controls setup
const setupTouchBtn = (id, onStart, onEnd) => {
  const el = document.getElementById(id);
  const startHandler = (e) => { e.preventDefault(); onStart(); };
  const endHandler = (e) => { e.preventDefault(); if(onEnd) onEnd(); };
  
  el.addEventListener('pointerdown', startHandler);
  el.addEventListener('pointerup', endHandler);
  el.addEventListener('touchstart', startHandler, { passive: false });
  el.addEventListener('touchend', endHandler, { passive: false });
};

setupTouchBtn('btnLeft', () => { keys['ArrowLeft'] = true; }, () => { keys['ArrowLeft'] = false; });
setupTouchBtn('btnRight', () => { keys['ArrowRight'] = true; }, () => { keys['ArrowRight'] = false; });
setupTouchBtn('btnSmash', () => { 
  if (gameState === 'PLAYING' && !player.attacking) triggerSmash();
});
setupTouchBtn('btnNuke', () => { 
  if (gameState === 'PLAYING' && breathEnergy >= maxBreathEnergy) triggerAtomicNuke();
});

// --- CORE GAME ACTIONS ---
function startGame() {
  score = 0; timer = 60; stagesCleared = 0;
  breathEnergy = 0; player.hp = 100;
  helicopters = []; bullets = []; particles = []; popups = [];
  gameState = 'PLAYING';
  initBuildings(0); resetTimer();
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gameState === 'PLAYING') {
      timer--;
      if (timer <= 0) gameOver();
    }
  }, 1000);
}

function gameOver() {
  gameState = 'GAMEOVER';
  if (score > highScore) highScore = score;
  clearInterval(timerInterval);
}

function triggerSmash() {
  player.attacking = true; 
  player.attackTimer = 10;
  playSound('smash'); 
  performSmash();
}

function triggerAtomicNuke() {
  breathEnergy = 0;
  nukeActiveTimer = 35;
  screenShake = 25;
  playSound('nuke');

  bullets = [];
  const m = monsters[selectedMonsterIdx];

  helicopters.forEach(h => {
    score += 300;
    addPopup("+300", h.x, h.y, m.accent);
    createParticles(h.x + h.w/2, h.y + h.h/2, m.accent, 12);
  });
  helicopters = [];

  buildings.forEach(b => {
    if (b.hp > 0) {
      b.hp = 0;
      score += 600;
      addPopup("NUKE! +600", b.x + b.w/2, b.y + 20, pal.accent);
      createParticles(b.x + b.w/2, b.y + b.h/2, m.accent, 15);
    }
  });

  checkStageClear();
}

function performSmash() {
  const range = 60;
  const smashX = player.dir === 'right' ? player.x + player.w : player.x - range;

  buildings.forEach(b => {
    if (b.hp > 0 && smashX < b.x + b.w && smashX + range > b.x) {
      b.hp = Math.max(0, b.hp - 35);
      score += 100;
      breathEnergy = Math.min(maxBreathEnergy, breathEnergy + 2);
      addPopup("+100", b.x + b.w/2, b.y + 20);
      createParticles(b.x + b.w/2, b.y + b.h/2, '#ffaa00', 6);

      if (b.hp === 0) {
        score += 400;
        breathEnergy = Math.min(maxBreathEnergy, breathEnergy + 5);
        addPopup("DESTROYED! +400", b.x + b.w/2, b.y - 10, pal.accent);
        checkStageClear();
      }
    }
  });
}

function checkStageClear() {
  const allDestroyed = buildings.every(b => b.hp <= 0);
  if (allDestroyed && !isTransitioning) {
    stagesCleared++;
    score += 1000;
    addPopup("CHEMBUR STAGE CLEARED! +1000", canvas.width/2, 150, pal.primary);
    isTransitioning = true;
    transitionProgress = 0;
  }
}

function createParticles(x, y, color = '#ffaa00', count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      size: Math.random() * 6 + 3, life: 18, color: color
    });
  }
}

function addPopup(text, x, y, color = '#ffff00') {
  popups.push({ text, x: Math.max(40, Math.min(canvas.width - 40, x)), y, life: 35, color });
}

// --- UPDATE LOOP ---
function update() {
  if (gameState !== 'PLAYING') return;

  if (keys['KeyA'] || keys['ArrowLeft']) { player.x -= player.speed; player.dir = 'left'; }
  if (keys['KeyD'] || keys['ArrowRight']) { player.x += player.speed; player.dir = 'right'; }
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  if (player.attacking) {
    player.attackTimer--;
    if (player.attackTimer <= 0) player.attacking = false;
  }

  if (nukeActiveTimer > 0) nukeActiveTimer--;
  if (screenShake > 0) screenShake--;

  if (isTransitioning) {
    transitionProgress += 0.05;
    bgOffset -= 15;
    if (transitionProgress >= 1) {
      isTransitioning = false;
      bgOffset = 0;
      initBuildings(stagesCleared);
    }
  }

  spawnHelicopters();

  helicopters.forEach((h, i) => {
    h.x += h.vx;
    if (h.x < -100 || h.x > canvas.width + 100) helicopters.splice(i, 1);

    h.fireCooldown--;
    if (h.fireCooldown <= 0) {
      h.fireCooldown = 55 + Math.random() * 30;
      const dx = (player.x + player.w/2) - (h.x + h.w/2);
      const dy = (player.y + player.h/2) - (h.y + h.h/2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      const bulletSpeed = Math.min(3.8, 1.8 + stagesCleared * 0.25);
      bullets.push({
        x: h.x + h.w/2, y: h.y + h.h/2,
        vx: (dx / dist) * bulletSpeed, vy: (dy / dist) * bulletSpeed
      });
    }
  });

  bullets.forEach((b, i) => {
    b.x += b.vx; b.y += b.vy;

    if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {
      player.hp = Math.max(0, player.hp - 8);
      screenShake = 6;
      playSound('hit');
      addPopup("-8 HP", player.x + player.w/2, player.y - 10, '#ff0000');
      bullets.splice(i, 1);

      if (player.hp <= 0) gameOver();
    }
    if (b.x < 0 || b.x > canvas.width || b.y > 400) bullets.splice(i, 1);
  });

  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  });
  popups.forEach((pop, i) => {
    pop.y -= 1; pop.life--;
    if (pop.life <= 0) popups.splice(i, 1);
  });
}

// --- RENDERING ---
function drawDetailedBuilding(b) {
  const currentH = (b.h * (b.hp / b.maxHp));
  const currentY = 360 - currentH;

  if (b.hp > 0) {
    ctx.fillStyle = b.color; 
    ctx.fillRect(b.x, currentY, b.w, currentH);
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(b.x + b.w - 12, currentY, 12, currentH);

    ctx.fillStyle = pal.window;
    const cols = 3;
    const colW = (b.w - 20) / cols;
    for (let c = 0; c < cols; c++) {
      const wx = b.x + 8 + c * (colW + 4);
      for (let wy = currentY + 14; wy < 345; wy += 22) {
        ctx.fillRect(wx, wy, colW, 10);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(wx, wy, colW / 2, 4);
        ctx.fillStyle = pal.window;
        
        ctx.fillStyle = '#111';
        ctx.fillRect(wx - 1, wy + 10, colW + 2, 2);
        ctx.fillStyle = pal.window;
      }
    }

    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(b.x - 2, currentY - 4, b.w + 4, 4);

    if (b.roofType === 0) {
      ctx.fillStyle = '#555'; ctx.fillRect(b.x + 12, currentY - 16, 16, 12);
    } else if (b.roofType === 1) {
      ctx.fillStyle = '#888'; ctx.fillRect(b.x + b.w/2 - 1, currentY - 22, 2, 18);
      ctx.fillStyle = (Math.floor(Date.now() / 400) % 2 === 0) ? '#ff0000' : '#440000';
      ctx.fillRect(b.x + b.w/2 - 3, currentY - 24, 6, 4);
    } else if (b.roofType === 2) {
      ctx.fillStyle = '#666'; ctx.fillRect(b.x + b.w - 24, currentY - 10, 14, 6);
    }

    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText(b.name, b.x + b.w / 2, 378);
  } else {
    ctx.fillStyle = '#222'; ctx.fillRect(b.x, 342, b.w, 18);
    ctx.fillStyle = '#444'; ctx.fillRect(b.x + 5, 340, 15, 6); ctx.fillRect(b.x + 45, 338, 20, 8);
    ctx.fillStyle = pal.accent; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('RUINED', b.x + b.w / 2, 357);
  }
}

function drawPlayer() {
  const m = monsters[selectedMonsterIdx];
  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
  if (player.dir === 'left') ctx.scale(-1, 1);

  if (m.id === 'godzilla') {
    ctx.fillStyle = m.color; ctx.fillRect(-20, -30, 40, 60);
    ctx.fillStyle = '#145a25'; ctx.fillRect(-10, -40, 35, 20);
    ctx.fillStyle = '#ffea00'; ctx.fillRect(15, -35, 6, 6);
    ctx.fillStyle = m.accent; ctx.fillRect(-24, -20, 6, 8); ctx.fillRect(-24, -5, 6, 8);
    if (player.attacking) { ctx.fillStyle = '#ffea00'; ctx.fillRect(20, -10, 25, 12); }
  } else if (m.id === 'cat') {
    ctx.fillStyle = m.color; ctx.fillRect(-20, -20, 40, 50);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-10, -10, 20, 30);
    ctx.fillStyle = m.color; ctx.fillRect(-15, -40, 30, 25);
    ctx.beginPath(); ctx.moveTo(-15, -40); ctx.lineTo(-20, -55); ctx.lineTo(-5, -40); ctx.fill();
    ctx.beginPath(); ctx.moveTo(15, -40); ctx.lineTo(20, -55); ctx.lineTo(5, -40); ctx.fill();
    ctx.fillStyle = '#00ffcc'; ctx.fillRect(2, -32, 5, 5);
    ctx.fillStyle = '#ffaa44'; ctx.fillRect(-30, 10, 15, 6);
    if (player.attacking) { ctx.fillStyle = '#ff00aa'; ctx.fillRect(15, -30, 25, 8); }
  } else if (m.id === 'bugblatter') {
    ctx.fillStyle = m.color; ctx.fillRect(-22, -35, 44, 65);
    ctx.fillStyle = '#440055'; ctx.fillRect(-15, -45, 30, 20);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-18, -48, 36, 12);
    ctx.fillStyle = '#ff0055'; ctx.fillRect(-18, -42, 36, 3);
    ctx.fillStyle = '#00ff66'; ctx.fillRect(-26, -10, 8, 15); ctx.fillRect(18, -10, 8, 15);
    if (player.attacking) { ctx.fillStyle = m.accent; ctx.fillRect(15, -15, 25, 14); }
  }

  ctx.restore();

  // ALWAYS DISPLAY 'MROQ' ON TOP REGARDLESS OF MONSTER CHOICE
  ctx.fillStyle = pal.primary; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
  ctx.fillText('MROQ', player.x + player.w / 2, player.y - 12);
}

function drawMenu() {
  ctx.fillStyle = 'rgba(5, 5, 10, 0.95)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = 'center';
  if (gameState === 'PALETTE_SELECT') {
    ctx.fillStyle = '#00ff66'; ctx.font = 'bold 24px monospace';
    ctx.fillText('SELECT COLOR PALETTE', canvas.width / 2, 110);
    ctx.font = '13px monospace'; ctx.fillStyle = '#aaa';
    ctx.fillText('Tap or Click your favorite visual theme:', canvas.width / 2, 140);

    const opts = [
      { key: '1. CYBER NEON', color: '#00ff66' },
      { key: '2. RETRO RED', color: '#ff4400' },
      { key: '3. SYNTH WAVE', color: '#ff00aa' }
    ];

    opts.forEach((o, i) => {
      const boxY = 180 + i * 55;
      ctx.fillStyle = '#111'; ctx.fillRect(250, boxY, 300, 40);
      ctx.strokeStyle = o.color; ctx.lineWidth = 2; ctx.strokeRect(250, boxY, 300, 40);
      ctx.fillStyle = o.color; ctx.font = 'bold 16px monospace';
      ctx.fillText(o.key, canvas.width / 2, boxY + 25);
    });

  } else if (gameState === 'MONSTER_SELECT') {
    ctx.fillStyle = pal.primary; ctx.font = 'bold 24px monospace';
    ctx.fillText('SELECT MROQ FORM', canvas.width / 2, 90);
    ctx.font = '13px monospace'; ctx.fillStyle = '#aaa';
    ctx.fillText('Tap or Click MROQ\'s form:', canvas.width / 2, 120);

    monsters.forEach((m, i) => {
      const boxY = 155 + i * 75;
      ctx.fillStyle = '#111'; ctx.fillRect(200, boxY, 400, 58);
      ctx.strokeStyle = m.accent; ctx.lineWidth = 2; ctx.strokeRect(200, boxY, 400, 58);
      
      ctx.fillStyle = m.accent; ctx.font = 'bold 15px monospace';
      ctx.fillText(`${i + 1}. MROQ: ${m.name}`, canvas.width / 2, boxY + 25);
      ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
      ctx.fillText(`POWER: ${m.power}`, canvas.width / 2, boxY + 44);
    });
  }
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  // Sky & Moon
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(720, 60, 30, 0, Math.PI * 2); ctx.fill();

  // Ground Line
  ctx.fillStyle = '#140a00'; ctx.fillRect(0, 360, canvas.width, 90);
  ctx.fillStyle = pal.primary; ctx.fillRect(0, 356, canvas.width, 4);

  // Buildings with Transition sliding support
  ctx.save();
  if (isTransitioning) ctx.translate(bgOffset, 0);
  buildings.forEach(b => drawDetailedBuilding(b));
  ctx.restore();

  // Helicopters & Bullets
  helicopters.forEach(h => {
    ctx.fillStyle = '#777'; ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.fillStyle = pal.secondary; ctx.fillRect(h.x + h.w/2 - 5, h.y + 4, 10, 6);
    ctx.fillStyle = '#fff'; ctx.fillRect(h.x - 10, h.y - 3, h.w + 20, 3);
  });

  bullets.forEach(b => {
    ctx.fillStyle = pal.accent; ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
  });

  drawPlayer();

  // Screen-Nuke Visual FX Overlay
  if (nukeActiveTimer > 0) {
    ctx.fillStyle = `rgba(0, 255, 200, ${nukeActiveTimer / 35})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // FX Particles & Floating Text
  particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
  popups.forEach(pop => { ctx.fillStyle = pop.color; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.fillText(pop.text, pop.x, pop.y); });

  // HUD: Score & Stage Info
  ctx.fillStyle = pal.primary; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score}`, 20, 28);
  ctx.fillText(`CHEMBUR SECTOR: #${stagesCleared + 1}`, 20, 48);

  // HUD: Health Bar
  ctx.fillStyle = '#333'; ctx.fillRect(20, 60, 140, 10);
  ctx.fillStyle = player.hp > 30 ? pal.primary : pal.accent; 
  ctx.fillRect(20, 60, (player.hp / player.maxHp) * 140, 10);
  ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.fillText(`HP: ${player.hp}%`, 22, 68);

  // HUD: BREATH BAR (Screen-Nuke)
  const isFull = breathEnergy >= maxBreathEnergy;
  const currentMonster = monsters[selectedMonsterIdx];
  ctx.fillStyle = '#222'; ctx.fillRect(20, 80, 200, 16);
  ctx.fillStyle = isFull ? (Math.floor(Date.now()/100)%2 === 0 ? pal.secondary : pal.accent) : pal.secondary;
  ctx.fillRect(20, 80, (breathEnergy / maxBreathEnergy) * 200, 16);
  ctx.fillStyle = isFull ? '#000' : '#fff'; ctx.font = 'bold 10px monospace';
  ctx.fillText(isFull ? `ENTER / NUKE FOR ${currentMonster.power}!` : `ENERGY: ${Math.floor(breathEnergy)}%`, 25, 92);

  // Timer & High Score
  ctx.textAlign = 'right'; ctx.fillStyle = timer <= 10 ? pal.accent : pal.primary;
  ctx.font = 'bold 16px monospace';
  ctx.fillText(`TIME: ${timer}s`, canvas.width - 20, 28);
  ctx.fillStyle = pal.primary; ctx.font = '14px monospace';
  ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 20, 48);

  // Overlay Screens
  if (gameState === 'PALETTE_SELECT' || gameState === 'MONSTER_SELECT') {
    drawMenu();
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = pal.accent; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
    ctx.fillText(player.hp <= 0 ? `MROQ WAS DESTROYED!` : 'TIME IS UP!', canvas.width / 2, 150);
    ctx.fillStyle = '#ffffff'; ctx.font = '18px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, 195);
    ctx.fillText(`SECTORS LEVELED: ${stagesCleared}`, canvas.width / 2, 225);
    ctx.fillStyle = pal.primary; ctx.font = '14px monospace';
    ctx.fillText("Press 'SPACE', 'R' or Tap Screen to Play Again!", canvas.width / 2, 280);
  }

  ctx.restore();
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
